[project]
name = "parallax"
version = "0.1.0"
description = "Query-chosen isolated viewpoints, then one decision with dissent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "typer>=0.15",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.28,<2",
]

[project.scripts]
parallax = "parallax.cli:app"
parallax-mcp = "parallax.mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mcp>=1.28,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
